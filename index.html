/* A bakery counter card: logo on a cream ground, two tabs like paper labels, the menu sheets stacked below. */
:root {
  --bg: #FBF5EC;

  --muted: #7A5A4E;
  --wine: #8C1E4F;

  --display: 'Lalezar', 'Segoe UI', Tahoma, sans-serif;
  --body: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --script: 'Damion', 'Brush Script MT', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1418; --card: #2A1D22; --fg: #F6EADF; --muted: #CDB6A6; --wine: #E07AA6;
    --pist: #7FC2A8; --tab: #33242A; --line: #47333A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1418; --card: #2A1D22; --fg: #F6EADF; --muted: #CDB6A6; --wine: #E07AA6;
  --pist: #7FC2A8; --tab: #33242A; --line: #47333A; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
.wrap {
  max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
header svg { width: 64px; height: auto; }
header h1 { margin: 6px 0 0; font: 400 2.6rem/1 var(--display); color: var(--pist); }
header .en { font: 400 1.35rem/1.1 var(--script); color: var(--wine); }
header p { margin: 8px 0 0; font: 700 1rem/1.5 var(--body); color: var(--muted); text-wrap: balance; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs a { display: flex; flex-direction: column; align-items: center; padding: 10px 8px 8px; border-radius: 14px;
  background: var(--tab); color: var(--fg); text-decoration: none; border: 2px solid transparent; }
.tabs a b { font: 400 1.5rem/1.1 var(--display); }
.tabs a span { font: 700 .72rem/1.4 var(--body); letter-spacing: .14em; color: var(--muted); }
.tabs a[aria-current="page"] { background: var(--wine); color: #FFF8EE; }
.tabs a[aria-current="page"] span { color: #FBE3C7; }
.tabs a:focus-visible, .copy:focus-visible, .links a:focus-visible { outline: 3px solid var(--pist); outline-offset: 2px; }

.sheets { display: flex; flex-direction: column; gap: 14px; }
.sheets a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.sheets img { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 1241 / 1754; }
.hint { margin: 0; text-align: center; font: 500 .85rem/1.5 var(--body); color: var(--muted); }

.order { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex;
  flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.order h2 { margin: 0; font: 400 1.6rem/1.1 var(--display); color: var(--pist); }
.order p { margin: 0; font: 600 .95rem/1.5 var(--body); color: var(--muted); }
.num { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.num output { font: 800 1.5rem/1 var(--body); direction: ltr; font-variant-numeric: tabular-nums; user-select: all; color: var(--fg); }
.copy { font: 700 .9rem/1 var(--body); padding: 8px 14px; border-radius: 99px; border: 2px solid var(--pist); background: transparent;
  color: var(--pist); cursor: pointer; }
.links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.links a { font: 700 .95rem/1 var(--body); padding: 11px 18px; border-radius: 99px; text-decoration: none; color: #FFF8EE; }
.links .wa { background: #2F7D5B; }
.links .ig { background: var(--wine); }
footer { text-align: center; font: 500 .8rem/1.5 var(--body); color: var(--muted); }

<script>
(function () {
  var views = ["sweet", "savory"];
  function show() {
    var h = (location.hash || "").replace("#", "");
    var cur = views.indexOf(h) >= 0 ? h : "sweet";
    views.forEach(function (v) {
      document.getElementById(v).hidden = v !== cur;
      var t = document.getElementById("tab-" + v);
      if (v === cur) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
  }
  window.addEventListener("hashchange", function () { show(); window.scrollTo(0, 0); });
  show();
  var btn = document.getElementById("copy");
  btn.addEventListener("click", function () {
    var done = function () { btn.textContent = "اتنسخ"; setTimeout(function () { btn.textContent = "انسخ الرقم"; }, 1600); };
    var pick = function () {
      var r = document.createRange(); r.selectNodeContents(document.getElementById("phone"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    try {
      navigator.clipboard.writeText("01021920609").then(done, pick);
    } catch (e) { pick(); }
  });
})();
</script>
